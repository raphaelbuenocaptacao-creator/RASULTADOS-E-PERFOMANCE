name: Align PWA service worker registration

on:
  push:
    paths:
      - '.github/workflows/pwa-align-register.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align service worker registration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});"
          new = "if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v=15-private-vary-range-safe-shell',{updateViaCache:'none'}).then(registration=>registration.update()).catch(()=>{});});}"
          if old not in text:
              raise SystemExit('Expected legacy SW registration not found; refusing destructive edit')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit aligned registration
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(pwa): align service worker registration v15'
          git push
