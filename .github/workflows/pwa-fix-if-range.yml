name: Apply PWA If-Range cache fix

on:
  push:
    paths:
      - '.github/workflows/pwa-fix-if-range.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch service worker safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old="key==='*'||key==='cookie'||key==='authorization'||key==='range';"
          new="key==='*'||key==='cookie'||key==='authorization'||key==='range'||key==='if-range';"
          if old not in s:
              raise SystemExit('Expected Vary policy not found; refusing broad edit')
          s=s.replace(old,new,1)
          s=s.replace('v15-private-vary-range-safe-shell','v16-private-vary-if-range-safe-shell',1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v15-private-vary-range-safe-shell','v16-private-vary-if-range-safe-shell')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          node --check sw.js
          grep -F "key==='if-range'" sw.js
          grep -F 'v16-private-vary-if-range-safe-shell' sw.js
          grep -F 'v16-private-vary-if-range-safe-shell' index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js index.html
          git commit -m 'fix(pwa): reject If-Range vary responses from cache'
          git push
