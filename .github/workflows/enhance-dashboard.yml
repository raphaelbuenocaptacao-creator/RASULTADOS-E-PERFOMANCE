name: Enhance Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/enhance-dashboard.yml'
jobs:
  enhance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard source
        run: |
          test -s index.html
          test -s Document1111.csv
          echo "Dashboard source and CSV are present."
      - name: No automatic rewrite
        run: echo "Manual consolidated dashboard is authoritative; no file rewriting performed."
